# Support lookup for one customer's orders. The customer is identified only by
# the SHA-256 of their email, so no email, name or card detail is printed
# (this repository is public). Read-only: Stripe, the dashboard database, Kit.
name: Quiz customer lookup

on:
  workflow_dispatch:
    inputs:
      email_sha256:
        description: "SHA-256 of the customer's lowercase email"
        required: true

env:
  HASH: ${{ github.event.inputs.email_sha256 }}

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$RAW_TOKEN" | grep -oi 'sbp_[A-Za-z0-9_]*' | head -n1 | sed 's/^[Ss][Bb][Pp]_/sbp_/' || true)"
          supabase functions deploy quiz-stripe-webhook --project-ref ohcdjvbveokyyilceenf --no-verify-jwt --use-api
          supabase functions deploy quiz-kit --project-ref ohcdjvbveokyyilceenf --no-verify-jwt --use-api
      - name: Stripe checkouts and dashboard rows (last 14 days)
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/call_quiz_function.py ohcdjvbveokyyilceenf quiz-stripe-webhook "{\"action\":\"lookup\",\"hash\":\"$HASH\"}"
      - name: Kit tags
        if: always()
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/call_quiz_function.py ohcdjvbveokyyilceenf quiz-kit "{\"action\":\"lookup\",\"hash\":\"$HASH\"}"
