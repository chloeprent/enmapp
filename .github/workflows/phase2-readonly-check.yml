# Read-only look at the live project before building Phase 2 (Stripe):
# which secrets exist (names only) and which purchase-related tables exist.
name: Phase 2 read-only check

on:
  push:
    branches: [claude/elegant-cannon-bdq3j0]
    paths:
      - "supabase/checks/phase2_readonly_check.sql"
      - ".github/scripts/list_secret_names.py"
      - ".github/workflows/phase2-readonly-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret names
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/list_secret_names.py ohcdjvbveokyyilceenf
      - name: Tables
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/run_readonly_sql.py ohcdjvbveokyyilceenf supabase/checks/phase2_readonly_check.sql
