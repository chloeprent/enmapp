# Quiz dashboard, Stripe purchases (Phase 2). On pushes to the working branch:
# deploys quiz-stripe-webhook, schedules the 5-minute safety-net sync, loads
# checkouts since launch (idempotent) and prints totals only. The purchases
# migration (2026101201) is already applied and is not re-run.
# --no-verify-jwt because Stripe calls the webhook without a Supabase token;
# the function checks Stripe's signature, or the service role for admin tasks.
name: Quiz Stripe

on:
  push:
    branches: [claude/elegant-cannon-bdq3j0]
    paths:
      - "supabase/functions/quiz-stripe-webhook/**"
      - "supabase/migrations/2026101302_quiz_stripe_sync_cron.sql"
      - "supabase/migrations/2026101303_quiz_stripe_events.sql"
      - "supabase/checks/phase2_after.sql"
      - ".github/scripts/call_quiz_function.py"
      - ".github/workflows/quiz-stripe.yml"
  workflow_dispatch:

jobs:
  deploy-and-load:
    runs-on: ubuntu-latest
    concurrency:
      group: quiz-stripe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Webhook call log table
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/apply_sql_file.py ohcdjvbveokyyilceenf supabase/migrations/2026101303_quiz_stripe_events.sql
      - name: Deploy function
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$RAW_TOKEN" | grep -oi 'sbp_[A-Za-z0-9_]*' | head -n1 | sed 's/^[Ss][Bb][Pp]_/sbp_/' || true)"
          supabase functions deploy quiz-stripe-webhook --project-ref ohcdjvbveokyyilceenf --no-verify-jwt --use-api
      - name: Schedule the safety-net sync
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/apply_sql_file.py ohcdjvbveokyyilceenf supabase/migrations/2026101302_quiz_stripe_sync_cron.sql
      - name: Load past paid checkouts
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/call_quiz_function.py ohcdjvbveokyyilceenf quiz-stripe-webhook '{"action":"backfill"}'
      - name: Totals (read-only)
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/run_readonly_sql.py ohcdjvbveokyyilceenf supabase/checks/phase2_after.sql
      - name: Checkouts since launch vs saved
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/call_quiz_function.py ohcdjvbveokyyilceenf quiz-stripe-webhook '{"action":"inspect"}'
