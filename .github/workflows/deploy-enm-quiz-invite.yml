# Deploy the enm-quiz-invite edge function to Supabase whenever its code lands
# on main. Needs the SUPABASE_ACCESS_TOKEN repository secret (a Supabase
# access token with Edge Functions write access to this project).
#
# Scoped to this one function on purpose: other functions need their own
# --no-verify-jwt choice (see docs/KEY-FILES.md), so they are not auto-deployed.

name: Deploy enm-quiz-invite

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/enm-quiz-invite/**"
      - "supabase/functions/_shared/api-helpers.ts"
      - ".github/workflows/deploy-enm-quiz-invite.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-enm-quiz-invite
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Pull the sbp_ token out of whatever was pasted (stray quotes, spaces,
          # invisible characters, a "Bearer " or "NAME=" prefix all happen), and
          # undo an autocorrected capital ("Sbp_"), which the CLI rejects.
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$RAW_TOKEN" | grep -oi 'sbp_[A-Za-z0-9_]*' | head -n1 | sed 's/^[Ss][Bb][Pp]_/sbp_/' || true)"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::No sbp_ token found in SUPABASE_ACCESS_TOKEN (value is ${#RAW_TOKEN} characters long). Paste the token from Supabase > Account > Access Tokens."
            exit 1
          fi
          echo "Using an sbp_ token of ${#SUPABASE_ACCESS_TOKEN} characters"
          supabase functions deploy enm-quiz-invite \
            --project-ref ohcdjvbveokyyilceenf \
            --no-verify-jwt \
            --use-api
