# Quiz dashboard, Kit email steps and polls (Phase 3). On pushes to the working
# branch: deploys quiz-kit and runs it. Prints names and counts only.
# --no-verify-jwt: Kit calls the webhook without a Supabase token; the function
# checks a per-webhook token, or the service role for admin tasks.
name: Quiz Kit

on:
  push:
    branches: [claude/elegant-cannon-bdq3j0]
    paths:
      - "supabase/functions/quiz-kit/**"
      - ".github/workflows/quiz-kit.yml"
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    concurrency:
      group: quiz-kit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$RAW_TOKEN" | grep -oi 'sbp_[A-Za-z0-9_]*' | head -n1 | sed 's/^[Ss][Bb][Pp]_/sbp_/' || true)"
          supabase functions deploy quiz-kit --project-ref ohcdjvbveokyyilceenf --no-verify-jwt --use-api
      - name: Kit summary (names and counts only)
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/call_quiz_function.py ohcdjvbveokyyilceenf quiz-kit '{"action":"discover"}'
