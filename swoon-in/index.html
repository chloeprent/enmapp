<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Swoon Admin</title>
<style>
  :root {
    --bg: #fdf2f4;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --border: #e8dde0;
    --card: #ffffff;
    --shadow: 0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 360px;
    margin: 1.5rem;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 2.25rem 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 0.375rem;
  }
  p.sub {
    color: var(--text-muted);
    font-size: 0.875rem;
    margin: 0 0 1.75rem;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.7rem 1.5rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  .btn-google:hover { border-color: #c9c9c9; box-shadow: var(--shadow); transform: translateY(-1px); }
  .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-google svg { width: 20px; height: 20px; }
  .signed-in p.who { font-size: 0.9375rem; margin: 0 0 1.25rem; }
  .btn-secondary {
    padding: 0.6rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-secondary:hover { border-color: #c9c9c9; }
  .msg {
    margin-top: 1rem;
    font-size: 0.8125rem;
    min-height: 1.2em;
    color: #b3261e;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>The Administration Building for SWOON</h1>
  <p class="sub">Sign in to continue.</p>

  <div id="signedOutView">
    <button type="button" class="btn-google" id="googleBtn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>
  </div>

  <div id="signedInView" class="signed-in hidden">
    <p class="who" id="whoami"></p>
    <a class="btn-secondary" id="quizLink" href="./quiz/" style="display:inline-block;text-decoration:none;margin-bottom:0.5rem">Quiz Analytics</a>
    <button type="button" class="btn-secondary" id="signOutBtn">Sign out</button>
  </div>

  <div id="deniedView" class="signed-in hidden">
    <p class="who" id="deniedWhoami"></p>
    <button type="button" class="btn-secondary" id="deniedSignOutBtn">Sign out</button>
  </div>

  <p class="msg" id="msg" role="alert"></p>
</div>

<script src="./vendor/supabase-js-2.39.3.min.js"></script>
<script type="module">
  import { supabase } from './supabase-client.js';

  const $ = (id) => document.getElementById(id);
  const SELF_URL = location.origin + location.pathname;

  function fail(message) {
    $('msg').textContent = message;
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const { data: isAdmin } = await supabase.rpc('enm_is_quiz_admin');
    if (isAdmin) {
      $('signedOutView').classList.add('hidden');
      $('signedInView').classList.remove('hidden');
      $('whoami').textContent = `Signed in as ${session.user.email || ''}`;
    } else {
      $('signedOutView').classList.add('hidden');
      $('deniedView').classList.remove('hidden');
      $('deniedWhoami').textContent = `${session.user.email || 'This account'} isn't on the admin list.`;
    }
  }

  $('deniedSignOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload();
  });

  $('googleBtn').addEventListener('click', async () => {
    const btn = $('googleBtn');
    btn.disabled = true;
    $('msg').textContent = '';
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: SELF_URL },
    });
    if (error) {
      fail(error.message || 'Google sign-in is unavailable.');
      btn.disabled = false;
    }
  });

  $('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload();
  });
</script>
</body>
</html>
