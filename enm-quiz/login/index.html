<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — ENM Style Quiz</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon-r.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4eee9; --text: #3c3c3c; --btn: #fc6a77; --btn-hover: #e0606b; --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Golos Text', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card { width: 100%; max-width: 380px; }
    h1 { font-size: 1.375rem; font-weight: 600; text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; font-size: .875rem; opacity: .7; margin-bottom: 26px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: .8125rem; font-weight: 600; margin-bottom: 5px; }
    input {
      width: 100%; font-family: inherit; font-size: 1rem; color: var(--text);
      background: #fff; border: 1px solid #e3d7d2; border-radius: var(--radius); padding: 12px 14px;
    }
    input:focus { outline: 2px solid var(--btn); outline-offset: -1px; border-color: transparent; }
    button {
      width: 100%; border: 0; cursor: pointer; font-family: inherit;
      font-size: 1rem; font-weight: 600; background: var(--btn); color: #fff;
      padding: 13px 20px; border-radius: 30px; margin-top: 6px;
      transition: background .18s ease;
    }
    button:hover { background: var(--btn-hover); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .google {
      background: #fff; color: var(--text); border: 1px solid #e3d7d2; margin-top: 10px;
    }
    .google:hover { background: #faf6f3; }
    .divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0 14px;
      font-size: .75rem; opacity: .5;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(60,60,60,.18);
    }
    .msg { text-align: center; font-size: .8125rem; margin-top: 14px; min-height: 1.3em; }
    .msg.err { color: #b3261e; }
    .back { display: block; text-align: center; font-size: .8125rem; margin-top: 22px;
      color: var(--text); opacity: .6; }
    .signed-in { text-align: center; }
    .signed-in p { font-size: .9375rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="formView">
      <h1>Sign in</h1>
      <p class="sub">Admins see the quiz design review at the bottom of the quiz page.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
        </div>
        <button type="submit" id="submitBtn">Sign in</button>
      </form>

      <div class="divider">or</div>
      <button type="button" class="google" id="googleBtn">Continue with Google</button>

      <p class="msg" id="msg" role="alert"></p>
    </div>

    <div id="signedInView" hidden class="signed-in">
      <h1>Already signed in</h1>
      <p class="sub" id="whoami"></p>
      <button type="button" id="goBtn">Go to the quiz</button>
      <button type="button" class="google" id="signOutBtn">Sign out</button>
    </div>

    <a class="back" href="../">&larr; Back to the quiz</a>
  </div>

  <script src="../vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module">
    import { supabase } from '../supabase-client.js';

    const $ = id => document.getElementById(id);
    /* Absolute, because Supabase's OAuth redirect needs a full URL and the
       magic-link flow will come back to whatever we hand it. */
    const QUIZ_URL = new URL('../', location.href).href;

    function fail(message) {
      const el = $('msg');
      el.className = 'msg err';
      el.textContent = message;
    }

    /* Someone who is already signed in should not be asked again — show them
       who they are and let them go straight through. */
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      $('formView').hidden = true;
      $('signedInView').hidden = false;
      $('whoami').textContent = session.user.email || '';
    }

    $('goBtn').addEventListener('click', () => { location.href = QUIZ_URL; });

    $('signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.reload();
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim();
      const password = $('password').value;
      const btn = $('submitBtn');

      if (!email || !password) { fail('Enter your email and password.'); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      $('msg').textContent = '';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        fail(error.message || 'Could not sign you in.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
        return;
      }
      location.href = QUIZ_URL;
    });

    $('googleBtn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: QUIZ_URL },
      });
      if (error) fail(error.message || 'Google sign-in is unavailable.');
    });
  </script>
</body>
</html>
